services:

  db:
    image: postgres:16-alpine
    container_name: chronicles_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: chronicles
      POSTGRES_USER: chronicles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U chronicles -d chronicles"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: chronicles_backend
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  frontend:
    image: nginx:alpine
    container_name: chronicles_frontend
    restart: unless-stopped

    volumes:
      - ./frontend:/usr/share/nginx/html:ro

    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: chronicles_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: